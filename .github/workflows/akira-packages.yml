name: Build and Deploy Akira Packages

on:
  pull_request:
    paths:
      - "srcpkgs/**"
  push:
    branches:
      - main
    paths:
      - "srcpkgs/**"
  workflow_dispatch:
    inputs:
      only_pkg:
        description: 'Build only this one package (empty = nothing)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Determine packages
    runs-on: ubuntu-latest
    outputs:
      has_packages: ${{ steps.changed.outputs.has_packages }}
      matrix: ${{ steps.changed.outputs.matrix }}
    container:
      image: ghcr.io/void-linux/void-glibc-full
    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d
          echo 'repository=https://repo-de.voidlinux.org/current' > /etc/xbps.d/00-repository-main.conf
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y bash curl git jq

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed templates
        id: changed
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Before: ${{ github.event.before }}"
          echo "SHA: ${{ github.sha }}"
          PKGS=""

          # workflow_dispatch: только явно указанный пакет, иначе ничего
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PKG="${{ github.event.inputs.only_pkg }}"
            if [ -z "$PKG" ]; then
              echo "workflow_dispatch without only_pkg — nothing to build"
              echo "has_packages=false" >> $GITHUB_OUTPUT
              echo "matrix=[]" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Manual build: $PKG"
            MATRIX=$(printf '%s\n' "$PKG" | jq -R . | jq -sc .)
            echo "has_packages=true" >> $GITHUB_OUTPUT
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
            exit 0
          fi

          # pull_request / push
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "BASE=$BASE HEAD=$HEAD"

          # первый push / force push: ничего не собираем автоматически
          if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
            echo "First push / force push — nothing to build automatically"
            echo "has_packages=false" >> $GITHUB_OUTPUT
            echo "matrix=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          git fetch origin "$BASE" || git fetch --unshallow || true

          for f in $(git diff --name-only "$BASE" "$HEAD" 2>/dev/null); do
            case "$f" in
              srcpkgs/*)
                name=$(echo "$f" | cut -d/ -f2)
                [ "$name" = "base-files" ] && continue
                [ -z "$name" ] && continue
                case " $PKGS " in
                  *" $name "*) ;;
                  *) PKGS="$PKGS $name" ;;
                esac
                ;;
            esac
          done

          PKGS=$(echo "$PKGS" | xargs)
          echo "Packages to build: '$PKGS'"

          if [ -z "$PKGS" ]; then
            echo "has_packages=false" >> $GITHUB_OUTPUT
            echo "matrix=[]" >> $GITHUB_OUTPUT
          else
            MATRIX=$(printf '%s\n' $PKGS | jq -R . | jq -sc .)
            echo "has_packages=true" >> $GITHUB_OUTPUT
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.pkg }}
    needs: prepare
    if: needs.prepare.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    env:
      XBPS_REPOSITORY: https://repo-de.voidlinux.org/current

    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --privileged
      volumes:
        - /dev:/dev

    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d
          echo 'repository=https://repo-de.voidlinux.org/current' > /etc/xbps.d/00-repository-main.conf
          echo 'repository=https://repo-de.voidlinux.org/current/nonfree' > /etc/xbps.d/10-repository-nonfree.conf
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y sudo bash curl git xtools
          useradd -G xbuilder -M builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          echo "builder:100000:65536" >> /etc/subuid
          echo "builder:100000:65536" >> /etc/subgid
          git config --global --add safe.directory /__w/akira-packages/akira-packages

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare masterdir
        run: |
          echo "XBPS_CHROOT_CMD=uchroot" >> etc/conf
          git config --system --add safe.directory /__w/akira-packages/akira-packages
          chown -R builder:builder .
          sudo -Eu builder ./xbps-src binary-bootstrap
          sudo -Eu builder ./xbps-src update-sys

      - name: Build ${{ matrix.pkg }}
        run: |
          echo "XBPS_ALLOW_RESTRICTED=yes" >> etc/conf
          [ -d hostdir ] && chown -R builder:builder hostdir
          sudo -Eu builder ./xbps-src pkg ${{ matrix.pkg }}

      - name: Show built packages
        run: find hostdir/binpkgs/ -name "*.xbps" 2>/dev/null || echo "Nothing found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.pkg }}-${{ github.sha }}
          path: hostdir/binpkgs/**/*.xbps
          retention-days: 7
          if-no-files-found: warn

  deploy:
    name: Sign and deploy to VPS
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: >
      needs.prepare.outputs.has_packages == 'true' &&
      needs.build.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    environment: production

    container:
      image: ghcr.io/void-linux/void-glibc-full

    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d
          echo 'repository=https://repo-de.voidlinux.org/current' > /etc/xbps.d/00-repository-main.conf
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y openssh rsync openssl xbps

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*-${{ github.sha }}
          path: ./pkgs
          merge-multiple: true

      - name: Show downloaded artifacts
        run: ls -la ./pkgs

      - name: Restore XBPS signing key
        env:
          AKIRA_PRIVATE_KEY: ${{ secrets.AKIRA_PRIVATE_KEY }}
        run: |
          echo "$AKIRA_PRIVATE_KEY" > /tmp/akira.pem
          chmod 600 /tmp/akira.pem
          openssl rsa -in /tmp/akira.pem -out /tmp/akira.key
          chmod 600 /tmp/akira.key
          rm -f /tmp/akira.pem
          openssl rsa -in /tmp/akira.key -check -noout

      - name: Sign new packages
        run: |
          cd ./pkgs
          for pkg in *.xbps; do
            [ -f "$pkg" ] || continue
            echo "Signing $pkg"
            xbps-rindex --sign-pkg \
              --privkey /tmp/akira.key \
              --signedby "Akira Linux" \
              "$pkg"
          done

      - name: Setup SSH
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_DEPLOY_KEY" > ~/.ssh/akira_deploy
          sed -i 's/\\n/\n/g' ~/.ssh/akira_deploy
          chmod 600 ~/.ssh/akira_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null

      - name: Fetch current repo
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p repo-current
          rsync -avz \
            -e "ssh -p $SSH_PORT -i $HOME/.ssh/akira_deploy -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            "$SSH_USER@$SSH_HOST:/var/www/akiralinux.org/repo/current/" \
            ./repo-current/

      - name: Remove old versions in temp repo
        run: |
          cd repo-current
          : > /tmp/old-files.txt

          for newpkg in ../pkgs/*.xbps; do
            [ -e "$newpkg" ] || continue
            newbase=$(basename "$newpkg")

            pkgname=$(xbps-query -p "$newpkg" 2>/dev/null | awk -F': ' '/^pkgname: /{print $2; exit}')
            if [ -z "$pkgname" ]; then
              pkgname=$(echo "$newbase" | sed -E 's/\.(x86_64|noarch)\.xbps$//; s/-[0-9][^-]*(_[0-9]+)?$//')
            fi

            [ -n "$pkgname" ] || { echo "Cannot determine pkgname for $newbase" >&2; exit 1; }
            echo "New package $newbase -> pkgname $pkgname"

            for old in ${pkgname}-*.xbps; do
              [ -e "$old" ] || continue
              [ "$old" = "$newbase" ] && continue
              echo "$old" >> /tmp/old-files.txt
              rm -f "$old" "$old.sig2"
            done

            case "$pkgname" in
              *-dbg) ;;
              *)
                for old in ${pkgname}-dbg-*.xbps; do
                  [ -e "$old" ] || continue
                  echo "$old" >> /tmp/old-files.txt
                  rm -f "$old" "$old.sig2"
                done
                ;;
            esac
          done

          echo "Old files to delete on VPS:"
          cat /tmp/old-files.txt

      - name: Add new packages and rebuild repodata
        run: |
          cp -f ./pkgs/*.xbps ./repo-current/ 2>/dev/null || true
          cp -f ./pkgs/*.sig2 ./repo-current/ 2>/dev/null || true

          cd repo-current
          for pkg in *.xbps; do
            [ -f "$pkg" ] || continue
            xbps-rindex -a "$pkg"
          done
          cd ..

          echo "=== Signing repository ==="
          xbps-rindex -s \
            --privkey /tmp/akira.key \
            --signedby "Akira Linux" \
            repo-current

          echo "=== After sign ==="
          ls -la repo-current

      - name: Upload packages and repodata to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -avz \
            -e "ssh -p $SSH_PORT -i $HOME/.ssh/akira_deploy -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            ./pkgs/*.xbps \
            "$SSH_USER@$SSH_HOST:/var/www/akiralinux.org/repo/current/"

          REPODATA_FILES="./repo-current/x86_64-repodata"
          if [ -f ./repo-current/x86_64-repodata.sig2 ]; then
            REPODATA_FILES="$REPODATA_FILES ./repo-current/x86_64-repodata.sig2"
          else
            echo "WARNING: x86_64-repodata.sig2 not found, uploading only repodata"
          fi

          rsync -avz \
            -e "ssh -p $SSH_PORT -i $HOME/.ssh/akira_deploy -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            $REPODATA_FILES \
            "$SSH_USER@$SSH_HOST:/var/www/akiralinux.org/repo/current/"

      - name: Cleanup old versions on VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          if [ -s /tmp/old-files.txt ]; then
            OLD_FILES=$(cat /tmp/old-files.txt | tr '\n' ' ')
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/akira_deploy" \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" "/home/builder/akira-remove-old.sh $OLD_FILES"
          else
            echo "No old files to remove"
          fi

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f /tmp/akira.key /tmp/old-files.txt
          rm -f "$HOME/.ssh/akira_deploy" "$HOME/.ssh/known_hosts"